<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#12303A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Flat Background -->
  <rect width="1200" height="630" fill="#0F5C5C"/>

  <!-- Subtle tint accent panel -->
  <rect x="60" y="50" width="1080" height="530" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Content Group -->
  <g transform="translate(110, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="480" height="42" rx="21" fill="#E6F0EE"/>
    <circle cx="20" cy="21" r="6" fill="#0F5C5C"/>
    <text x="36" y="26" fill="#0F5C5C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">MBBS • PMDC REG: 962063-01-M • SIR GANGA RAM</text>

    <!-- Main Title -->
    <text x="0" y="115" fill="#12303A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1">Dr. Muhammad Saad Obhaya</text>
    <text x="0" y="175" fill="#0F5C5C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700">MBBS | Medical Doctor &amp; Clinical Consultant</text>

    <!-- Description -->
    <text x="0" y="235" fill="#5B6B70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Compassionate Care. Evidence-Based Medicine. Consultations in Lahore.</text>

    <!-- Info Pills -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="300" height="54" rx="14" fill="#E6F0EE"/>
      <text x="20" y="33" fill="#12303A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">🕒 Daily: 8am-2pm &amp; 7pm-10pm</text>

      <rect x="320" y="0" width="310" height="54" rx="14" fill="#E6F0EE"/>
      <text x="340" y="33" fill="#12303A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">🏥 Sir Ganga Ram Hospital</text>

      <rect x="650" y="0" width="300" height="54" rx="14" fill="#E6F0EE"/>
      <text x="670" y="33" fill="#12303A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">📞 +92 339 6999200</text>
    </g>

    <!-- Accent CTA Button Representation -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="240" height="48" rx="12" fill="#D9822B"/>
      <text x="35" y="30" fill="#12303A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Book Appointment</text>
    </g>
  </g>

  <!-- URL Brand footer -->
  <text x="110" y="545" fill="#5B6B70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">drsaadconsults.netlify.app</text>
</svg>
