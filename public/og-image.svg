<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="200" cy="150" r="300" fill="#38bdf8" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1000" cy="500" r="250" fill="#14b8a6" opacity="0.15" filter="blur(60px)"/>

  <!-- Content Card -->
  <g transform="translate(100, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="360" height="46" rx="23" fill="#ffffff" opacity="0.15"/>
    <circle cx="24" cy="23" r="7" fill="#34d399"/>
    <text x="44" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1">MBBS • SIR GANGA RAM HOSPITAL</text>

    <!-- Main Title -->
    <text x="0" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Dr. Muhammad Saad</text>
    <text x="0" y="200" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">Obhaya (MBBS)</text>

    <!-- Description -->
    <text x="0" y="270" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Compassionate Care. Evidence-Based Medicine. Consultations in Lahore.</text>

    <!-- Info Pills -->
    <g transform="translate(0, 330)">
      <rect x="0" y="0" width="280" height="56" rx="16" fill="#ffffff" opacity="0.12"/>
      <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">🕒 Daily: 8am-2pm &amp; 7pm-10pm</text>

      <rect x="300" y="0" width="280" height="56" rx="16" fill="#ffffff" opacity="0.12"/>
      <text x="324" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">🏥 Sir Ganga Ram Hospital</text>

      <rect x="600" y="0" width="280" height="56" rx="16" fill="#ffffff" opacity="0.12"/>
      <text x="624" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">📞 +92 339 6999200</text>
    </g>
  </g>

  <!-- URL Brand footer -->
  <text x="100" y="560" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">drsaadconsults.netlify.app</text>
</svg>
